# Minimal least-capability DeepSeek Harness composition for the math teacher agent.
#
# SECURITY INVARIANT (Prompt 2 gate):
#   - Only the core services below are mounted.
#   - NEVER add bash / filesystem / web / subagent / workflow / terminal entries.
#   - Model-visible tools are exclusively the 6 controlled read-only teacher tools
#     registered by the teacher-agent plugin (src/dsh/teacher-plugin.ts).
#
# Do not use the default `@deepseek-ai/dsh-base` bundle: it mounts shell,
# filesystem, web search and subagent capabilities by default.

- id: llm
  name: './plugins/llm.mjs'

- id: session
  name: './plugins/session.mjs'

- id: system-prompt
  name: './plugins/system-prompt.mjs'
  config:
    persona: |-
      你是中国高中数学教师的可信备课助手。
      你只能通过已注册的 6 个受控只读工具查询题库、调用可信解题、查询相似题、数学验证和教材知识点。
      你绝不能执行命令、读写文件、上网浏览或访问数据库，也不得调用任何未注册的工具。
      所有答案只依据工具返回的结构化结果；无法确定时必须明确说明。

      搜题（Search Agent）硬性规则：
      1. 题目只能来自工具返回结果；禁止自己编写或补全任何题目冒充搜索结果。
      2. 禁止编造 question_id、题干、选项、答案、来源、学校、考试名称、年份、地区或验证状态。
      3. 教师的 hard 条件（只要/必须/限定/不要/排除）绝不静默放宽；满足不了必须如实说明数量不足。
      4. soft 偏好（最好/优先/相近也行）可以按结构化意图建议补充，但必须说明哪些结果属于补充。
      5. 找不到完全满足条件的题目时，如实回答“没有找到”，不得虚构题目补足数量。
      6. 只读：不执行任何写操作；不回答与本产品无关的学生端任务。

      解题（Solve Agent）硬性规则：
      1. 完整解题必须调用 solve_question；不得绕过 FastAPI 业务模块自行生成并冒充产品解题结果。
      2. 必须原样保留 confidence_status、math_verification、verification_evidence、mode 和 warnings，不得改写可信等级或验证作用范围。
      3. teacher_review_required 表示需要教师复核，绝不能表述为程序验证通过。
      4. VERIFICATION_FAILED、VERIFICATION_INCONCLUSIVE 或模型不可用时必须明确失败，不得用模型常识临时补写答案。
      5. 解题结果只读且不自动保存、发布、批准验证或改变题库内容。

- id: tools
  name: './plugins/tools.mjs'

- id: agent
  name: './plugins/agent.mjs'

- id: agent-loop
  name: './plugins/agent-loop.mjs'
  config:
    agents: []

- id: session-persistence-jsonl
  name: './plugins/session-persistence-jsonl.mjs'
  config:
    # root 由 TeacherAgentRuntime 通过官方 patch 机制覆盖为绝对路径
    # （gitignored: data/runtime/agent-sessions）。
    root: data/runtime/agent-sessions
    compression: none

# 官方 DeepSeek provider adapter：仅当存在真实 API Key 时启用。
# 自动化测试绝不挂载该 adapter（无 key -> 禁用），测试统一走 test-mock。
- id: llm-deepseek
  name: './plugins/llm-deepseek.mjs'
  disabled: !!js "!process.env.MATH_AI_DEEPSEEK_API_KEY"
  config:
    apiKeyEnv: MATH_AI_DEEPSEEK_API_KEY
